[project]
name = "gtwr-explorer-backend"
version = "0.1.0"
description = "FastAPI backend serving GTWR local-coefficient data for the Seoul map explorer."
requires-python = ">=3.11"
readme = "../README.md"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"